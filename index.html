<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Shopping List</h1>

    <!-- Summary Statistics Area -->
    <header>
      <span>Purchased total</span>
      <strong id="purchased-total">KSh 0.00</strong>
      <p id="list-count">0 items</p>
    </header>

    <!-- Content Control Buttons -->
    <div>
      <h2>My items</h2>
      <button id="clear-list" type="button" disabled>Clear list</button>
    </div>

    <!-- Data Entry Form -->
    <form id="add-form">
      <div>
        <label for="product-name">Item</label>
        <input id="product-name" name="name" type="text" placeholder="Item name" required />
      </div>

      <div>
        <label for="product-price">Price (KSh)</label>
        <input id="product-price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
      </div>

      <button type="submit">Add item</button>
    </form>

    <!-- Dynamic Target List -->
    <ul id="shopping-list"></ul>
  </body>
</html>
