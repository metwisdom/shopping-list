<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <section class="total-panel" aria-live="polite" aria-atomic="true">
          <span class="total-label">Purchased total</span>
          <strong id="purchased-total">KSh 0.00</strong>
        </section>
      </header>

      <section class="list-section" aria-labelledby="list-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR BASKET</p>

        <form class="add-form" id="add-form">
          <div class="field field-name">
            <label for="product-name">Item</label>
            <input
              id="product-name"
              name="name"
              type="text"
              placeholder="e.g. Fresh mangoes"
              maxlength="80"
              required
            />
          </div>
          <div class="field field-price">
            <label for="product-price">Price (KSh)</label>
            <input
              id="product-price"
              name="price"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              required
            />
          </div>
          <button class="add-button" type="submit">
            <span aria-hidden="true">+</span> Add item
          </button>
                    </div>
          <button class="text-button" id="clear-list" type="button" disabled>
            Clear list
          </button>
        </div>

        </form>

        <ul
          class="shopping-list"
          id="shopping-list"
          aria-label="Shopping list"
        ></ul>
        <p class="list-footer" id="list-count" aria-live="polite">0 items</p>
      </section>
    </main>
  </body>
</html>
